name: Build NexVora Companion Android APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'Android/**'
      - '.github/workflows/build_android.yaml'

  pull_request:
    branches:
      - main
    paths:
      - 'Android/**'

permissions:
  contents: read

concurrency:
  group: nexvora-companion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build NexVora Companion APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    defaults:
      run:
        working-directory: Android/src

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        run: |
          set -e
          yes | sdkmanager --licenses

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platforms;android-37.0" \
            "platform-tools"
          sdkmanager --list_installed

      - name: Configure Android 37 SDK compatibility
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -d "$SDK/platforms/android-37.0" ] && \
             [ ! -e "$SDK/platforms/android-37" ]; then
            ln -s android-37.0 "$SDK/platforms/android-37"
          fi
          ls -la "$SDK/platforms"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Android project
        run: |
          set -e
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradlew
          test -f app/build.gradle.kts
          echo "Android project structure verified."

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Check Gradle environment
        run: |
          java -version
          ./gradlew --version

      - name: Check Gradle modules
        run: ./gradlew projects --no-daemon

      - name: Build NexVora Companion APK
        run: |
          set -o pipefail
          ./gradlew clean :app:assembleDebug \
            --stacktrace \
            --no-daemon \
            --warning-mode all \
            2>&1 | tee build.log

      - name: Verify APK
        run: |
          set -e
          APK_DIR="app/build/outputs/apk/debug"
          test -d "$APK_DIR"
          find "$APK_DIR" -name "*.apk" -type f
          APK="$(find "$APK_DIR" -name "*.apk" -type f | head -n 1)"
          test -n "$APK"
          ls -lh "$APK"
          echo "APK successfully generated."

      - name: Upload NexVora Companion Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NexVora-Companion-Debug-APK
          path: Android/src/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NexVora-Companion-Build-Log
          path: Android/src/build.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Build Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: NexVora-Companion-Build-Reports
          path: |
            Android/src/app/build/reports/
            Android/src/build/reports/
          if-no-files-found: ignore
          retention-days: 30
