
name: Build NexVora Companion Android APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'Android/**'
      - '.github/workflows/build_android.yaml'

  pull_request:
    branches:
      - main
    paths:
      - 'Android/**'

permissions:
  contents: read

concurrency:
  group: nexvora-companion-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build NexVora Companion
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: Android/src

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Install Android SDK command-line tools
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # Install required SDK packages
      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-37" \
            "build-tools;37.0.0" \
            "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Android project
        run: |
          test -f settings.gradle || test -f settings.gradle.kts
          test -f gradlew
          test -d app
          echo "Project structure verified"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Check Gradle modules
        run: ./gradlew projects --no-daemon

      - name: Build Debug APK
        run: |
          set -o pipefail
          ./gradlew clean :app:assembleDebug \
            --stacktrace \
            --no-daemon \
            --warning-mode all \
            2>&1 | tee build.log

      - name: Verify APK
        run: |
          find app/build/outputs/apk -type f -name "*.apk" -print
          test -n "$(find app/build/outputs/apk/debug -type f -name "*.apk" -print -quit)"
          ls -lh app/build/outputs/apk/debug/*.apk
          echo "APK BUILD SUCCESSFUL"

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NexVora-Companion-Debug-APK
          path: Android/src/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NexVora-Companion-Build-Log
          path: Android/src/build.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Build Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: NexVora-Companion-Build-Reports
          path: |
            Android/src/app/build/reports/
            Android/src/build/reports/
          if-no-files-found: ignore
          retention-days: 30

